<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo do Cartório — JEC Marília</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --bg2: #1e293b;
            --bg3: #334155;
            --fg: #f1f5f9;
            --fg2: #94a3b8;
            --fg3: #64748b;
            --accent: #3b82f6;
            --accent2: #8b5cf6;
            --green: #22c55e;
            --amber: #f59e0b;
            --red: #ef4444;
            --teal: #14b8a6;
            --pink: #ec4899;
            --radius: 10px;
            --shadow: 0 4px 24px rgba(0, 0, 0, .4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            overflow: hidden;
            height: 100vh;
        }

        /* Layout */
        #app {
            display: grid;
            grid-template-columns: 300px 1fr 360px;
            grid-template-rows: 56px 1fr;
            height: 100vh;
        }

        header {
            grid-column: 1/-1;
            background: var(--bg2);
            border-bottom: 1px solid var(--bg3);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
            z-index: 10;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
            white-space: nowrap;
        }

        header h1 span {
            color: var(--accent);
        }

        #search {
            flex: 1;
            max-width: 400px;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--bg3);
            background: var(--bg);
            color: var(--fg);
            font-size: 14px;
            outline: none;
        }

        #search:focus {
            border-color: var(--accent);
        }

        .header-stats {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: var(--fg2);
            margin-left: auto;
        }

        .header-stats b {
            color: var(--fg);
            font-weight: 600;
        }

        /* Sidebar */
        #sidebar {
            background: var(--bg2);
            border-right: 1px solid var(--bg3);
            overflow-y: auto;
            padding: 12px;
        }

        .sb-section {
            margin-bottom: 16px;
        }

        .sb-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--fg3);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .sb-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            border: none;
            background: transparent;
            color: var(--fg2);
            width: 100%;
            text-align: left;
            transition: all .15s;
        }

        .sb-btn:hover {
            background: var(--bg3);
            color: var(--fg);
        }

        .sb-btn.active {
            background: var(--accent);
            color: #fff;
        }

        .sb-btn .count {
            margin-left: auto;
            font-size: 11px;
            opacity: .7;
        }

        .sb-btn .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* Main Graph Area */
        #graph-area {
            position: relative;
            background: var(--bg);
        }

        #graph {
            width: 100%;
            height: 100%;
        }

        #graph-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            gap: 8px;
            z-index: 5;
        }

        .overlay-btn {
            padding: 6px 12px;
            border-radius: 6px;
            background: var(--bg2);
            border: 1px solid var(--bg3);
            color: var(--fg2);
            font-size: 12px;
            cursor: pointer;
        }

        .overlay-btn:hover {
            background: var(--bg3);
            color: var(--fg);
        }

        .overlay-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        #graph-legend {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: var(--bg2);
            border: 1px solid var(--bg3);
            border-radius: var(--radius);
            padding: 10px 14px;
            font-size: 11px;
            z-index: 5;
            display: flex;
            gap: 16px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--fg2);
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            z-index: 20;
        }

        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Right Panel */
        #panel {
            background: var(--bg2);
            border-left: 1px solid var(--bg3);
            overflow-y: auto;
            padding: 16px;
        }

        .panel-empty {
            text-align: center;
            color: var(--fg3);
            margin-top: 80px;
            font-size: 14px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .panel-badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            word-break: break-word;
        }

        .panel-section {
            margin-bottom: 14px;
        }

        .panel-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .8px;
            color: var(--fg3);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .panel-value {
            font-size: 13px;
            color: var(--fg);
            line-height: 1.5;
        }

        .panel-value a {
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
        }

        .panel-value a:hover {
            text-decoration: underline;
        }

        .panel-chip {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin: 2px;
            background: var(--bg3);
        }

        .panel-flow {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 4px 0;
            font-size: 13px;
        }

        .panel-flow .arrow {
            color: var(--accent);
            font-weight: 700;
        }

        .panel-tab-bar {
            display: flex;
            border-bottom: 1px solid var(--bg3);
            margin-bottom: 12px;
        }

        .panel-tab {
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 500;
            color: var(--fg3);
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .panel-tab:hover {
            color: var(--fg2);
        }

        .panel-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .panel-tab-content {
            display: none;
        }

        .panel-tab-content.active {
            display: block;
        }

        /* Dashboard Cards */
        .dash-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }

        .dash-card {
            background: var(--bg);
            border: 1px solid var(--bg3);
            border-radius: 8px;
            padding: 12px;
        }

        .dash-card .num {
            font-size: 24px;
            font-weight: 700;
        }

        .dash-card .lbl {
            font-size: 11px;
            color: var(--fg3);
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        /* Issues list */
        .issue-item {
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 12px;
            cursor: pointer;
            background: var(--bg);
            border: 1px solid var(--bg3);
        }

        .issue-item:hover {
            border-color: var(--accent);
        }

        .issue-tag {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 10px;
            margin-right: 4px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg3);
            border-radius: 3px;
        }

        /* Responsive */
        @media (max-width:1200px) {
            #app {
                grid-template-columns: 240px 1fr 300px;
            }
        }

        @media (max-width:900px) {
            #app {
                grid-template-columns: 1fr;
                grid-template-rows: 56px 1fr;
            }

            #sidebar,
            #panel {
                display: none;
            }
        }

        /* === Auth overlay === */
        #auth-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.94);z-index:99999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
        #auth-box{background:#1e293b;border-radius:14px;padding:44px 38px 34px;max-width:380px;width:90%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.5);border:1px solid #334155}
        #auth-box h2{margin:0 0 8px;font-size:1.4rem;color:#f1f5f9}
        #auth-box p{margin:0 0 20px;font-size:.9rem;color:#94a3b8}
        #auth-input{width:100%;padding:11px 14px;border:2px solid #334155;border-radius:8px;font-size:1rem;box-sizing:border-box;outline:none;background:#0f172a;color:#e2e8f0;transition:border-color .2s}
        #auth-input:focus{border-color:#3b82f6}
        #auth-btn{margin-top:14px;width:100%;padding:11px;background:#3b82f6;color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;font-weight:600;transition:background .2s}
        #auth-btn:hover{background:#2563eb}
        #auth-error{color:#ef4444;font-size:.85rem;margin-top:10px;display:none}
        body.auth-locked #app{display:none!important}
    </style>
</head>

<body>
    <!-- Auth gate — mesma senha do Manual MkDocs, mesma sessão localStorage -->
    <script>
    (function(){
        var PASS_HASH='2eb4959e89c44e97eb33d26bdbe054b5235cf9898a8d0f7827071affc2b9e07a';
        var STORAGE_KEY='docs_auth';var EXPIRY_KEY='docs_auth_exp';var TTL=7*24*60*60*1000;
        var s=localStorage.getItem(STORAGE_KEY),e=localStorage.getItem(EXPIRY_KEY);
        if(s===PASS_HASH&&e&&Date.now()<Number(e))return;
        document.body.classList.add('auth-locked');
        var ov=document.createElement('div');ov.id='auth-overlay';
        ov.innerHTML='<div id="auth-box"><h2>🔒 Área restrita</h2><p>Digite a senha de acesso</p><input id="auth-input" type="password" placeholder="Senha" autocomplete="off"/><button id="auth-btn">Entrar</button><div id="auth-error">Senha incorreta. Tente novamente.</div></div>';
        document.body.appendChild(ov);
        function sha256(m){var enc=new TextEncoder();return crypto.subtle.digest('SHA-256',enc.encode(m)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}
        setTimeout(function(){
            var inp=document.getElementById('auth-input'),btn=document.getElementById('auth-btn'),err=document.getElementById('auth-error');
            function go(){sha256(inp.value).then(function(h){if(h===PASS_HASH){localStorage.setItem(STORAGE_KEY,PASS_HASH);localStorage.setItem(EXPIRY_KEY,String(Date.now()+TTL));document.body.classList.remove('auth-locked');ov.remove()}else{err.style.display='block';inp.value='';inp.focus()}})}
            btn.addEventListener('click',go);inp.addEventListener('keydown',function(e){if(e.key==='Enter')go()});inp.focus();
        },50);
    })();
    </script>

io CP pela parte[jec] - zAux - Prazo envio CP pela parte[jec]", "rl": null, "sd": "Para assinar" }, { "nm": "Mandado de Intimação da Sentença (escolher parte e colocar prazo)", "ev": "Expedição de mandado", "pl": null, "pr": null, "nl": "Prazo - Recurso ⏳🔼 - Prazo - Recurso ⏳🔼[jec]", "rl": null, "sd": "Para assinar" }, { "nm": "Migr+Int", "ev": "Decisão/Despacho - Despacho (11010)", "pl": "Ambos", "pr": "5", "nl": "Prazo - Indicar Bens ⏳🅱️ - Prazo - Indicar Bens ⏳🅱️[jec]", "rl": null, "sd": "Para assinar" }, { "nm": "Migr+Tema 1264", "ev": "Decisão/Despacho - Processo Suspenso por Recurso Especial Repetitivo (11975)", "pl": "Autor", "pr": "5", "nl": "Suspenso - IRDR e semelhantes ⏱️ - Suspenso - IRDR e semelhantes ⏱️[jec]", "rl": null, "sd": "Para assinar" }, { "nm": "Migra+CumpSent", "ev": "Decisão/Despacho - Despacho (11010)", "pl": "Autor", "pr": "5", "nl": "Prazo Provisório - Pós TJ - Prazo Provisório - Pós TJ[jec]", "rl": null, "sd": "Para assinar" }, { "nm": "Ofício - Revoga Tutela - INSS", "ev": "Expedição de ofício (60)", "pl": null, "pr": null, "nl": "📋 Cumprir - Enviar Ofício/E-mail - 📋 Cumprir - Enviar Ofício/E-mail", "rl": null, "sd": "Para assinar" }, { "nm": "Ofício Genérico", "ev": "Expedição de ofício (60)", "pl": null, "pr": null, "nl": "📋 Cumprir - Enviar Ofício/E-mail - 📋 Cumprir - Enviar Ofício/E-mail", "rl": null, "sd": "Para assinar" }, { "nm": "Ofício SCPC (Suspensão)", "ev": "Expedição de ofício (60)", "pl": null, "pr": null, "nl": "MANTER LOCALIZADOR ATUAL", "rl": null, "sd": "Para assinar" }, { "nm": "Termo de Penhora e Depósito (selec. destinatário)", "ev": "Expedição de Termo/auto de Penhora (60)", "pl": null, "pr": null, "nl": "🔍 Conferir - Análise - 🔍 Conferir - Análise", "rl": null, "sd": "Para assinar" }];
    </script>
    <script>
        'use strict';
        // ===== COLOR MAP =====
        const CAT_COLORS = {
            'Prazo': '#3b82f6', 'Prazo Interno': '#2196F3', 'Cumprimento': '#22c55e',
            'Gatilho': '#f59e0b', 'Classificação': '#a855f7', 'Fluxo': '#ec4899',
            'Auxiliar': '#ef4444', 'Sistema': '#64748b', 'Sistema (eproc)': '#475569',
            'Pesquisa': '#14b8a6', 'Contagem': '#f97316', 'Individual': '#e91e63',
            'Controle': '#795548', 'Gabinete': '#7c3aed', 'Suspenso': '#607d8b',
            'Divisão de Trabalho': '#546e7a', 'Audiência': '#8e24aa', 'Urgência': '#dc2626',
            'Tema': '#1976d2', 'Desativado': '#757575'
        };
        function catColor(cat) { return CAT_COLORS[cat] || '#64748b'; }
        function norm(s) { return (s || '').replace(/\s+/g, ' ').trim(); }
        function dedupLoc(s) { return s.replace(/(.+?) - \1(?=\s+(?:E|OU)\s+|$)/g, '$1'); }
        function stripJec(s) { return s.replace(/\s*\[jec\]\s*$/i, '').trim(); }
        function stripEmoji(s) { const m = s.match(/[A-ZÀ-ÖØ-öø-ÿa-z0-9]/); return m ? s.substring(m.index).trim() : s; }

        // ===== INDEXES =====
        const locMap = {}; // name → loc object
        DATA_LOCS.forEach(l => { locMap[norm(l.nome)] = l; });
        // Reverse lookup: stripped name → locMap key (for fuzzy pref matching)
        const locLookup = {};
        Object.keys(locMap).forEach(k => { locLookup[stripEmoji(k).toLowerCase()] = k; });
        function findLocKey(rawNl) {
            let nl = norm(dedupLoc(stripJec(rawNl)));
            if (locMap[nl]) return nl;
            const simple = stripEmoji(nl).toLowerCase();
            if (locLookup[simple]) return locLookup[simple];
            return null;
        }

        // Build edges from ATPs: locRemover → locIncluir
        const edges = [];  // {from, to, atp, label}
        const nodeSet = new Set();
        const atpsByLoc = {}; // locName → [atp, ...]

        DATA_ATPS.forEach(atp => {
            const r = norm(atp.r);
            const i = norm(atp.i);
            if (!r && !i) return;
            if (r) { nodeSet.add(r); (atpsByLoc[r] = atpsByLoc[r] || []).push(atp); }
            if (i) { nodeSet.add(i); (atpsByLoc[i] = atpsByLoc[i] || []).push(atp); }
            if (r && i) {
                edges.push({ from: r, to: i, atp, label: atp.g || ('ATP #' + atp.n) });
            }
            // Additional localizadores
            if (atp.ad) {
                atp.ad.forEach(a => {
                    const parts = a.split(' ');
                    const op = parts[0];
                    const loc = norm(parts.slice(1).join(' '));
                    if (loc) { nodeSet.add(loc); (atpsByLoc[loc] = atpsByLoc[loc] || []).push(atp); }
                });
            }
            // Error loc
            if (atp.e) { const e = norm(atp.e); nodeSet.add(e); (atpsByLoc[e] = atpsByLoc[e] || []).push(atp); }
        });

        // Add all custom locs
        DATA_LOCS.forEach(l => { if (!l.sistema) nodeSet.add(norm(l.nome)); });

        // Prefs edges (with dedupLoc + fuzzy matching)
        const prefsByLoc = {};
        DATA_PREFS.forEach(p => {
            const key = findLocKey(p.nl || '');
            if (key) { (prefsByLoc[key] = prefsByLoc[key] || []).push(p); }
        });

        // ===== STATS =====
        const totalProcs = DATA_LOCS.reduce((s, l) => s + (l.totalProcessos || 0), 0);
        document.getElementById('st-locs').textContent = DATA_LOCS.length;
        document.getElementById('st-atps').textContent = DATA_ATPS.length;
        document.getElementById('st-prefs').textContent = DATA_PREFS.length;
        document.getElementById('st-procs').textContent = totalProcs.toLocaleString('pt-BR');

        // ===== Build categories sidebar =====
        const catCounts = {};
        DATA_LOCS.forEach(l => { const c = l.categoria || 'Outro'; catCounts[c] = (catCounts[c] || 0) + 1; });
        const catList = document.getElementById('cat-list');
        Object.entries(catCounts).sort((a, b) => b[1] - a[1]).forEach(([cat, cnt]) => {
            const btn = document.createElement('button');
            btn.className = 'sb-btn';
            btn.dataset.cat = cat;
            btn.innerHTML = '<div class="dot" style="background:' + catColor(cat) + '"></div>' + cat + '<span class="count">' + cnt + '</span>';
            btn.onclick = () => filterByCategory(cat);
            catList.appendChild(btn);
        });

        // ===== Build group sidebar =====
        const groupCounts = {};
        DATA_ATPS.forEach(a => { const g = a.g || '(sem grupo)'; groupCounts[g] = (groupCounts[g] || 0) + 1; });
        const groupList = document.getElementById('group-list');
        Object.entries(groupCounts).sort((a, b) => a[0].localeCompare(b[0], 'pt-BR')).forEach(([g, cnt]) => {
            const btn = document.createElement('button');
            btn.className = 'sb-btn';
            btn.dataset.group = g;
            btn.innerHTML = g + '<span class="count">' + cnt + '</span>';
            btn.onclick = () => filterByGroup(g);
            groupList.appendChild(btn);
        });

        // ===== GRAPH =====
        let network, allNodes, allEdges, showLabels = true, physicsOn = true;

        function buildGraph(filterFn) {
            if (typeof vis === 'undefined') return;
            const nodes = [];
            const edgesVis = [];
            const added = new Set();

            function addNode(name) {
                if (added.has(name)) return;
                added.add(name);
                const loc = locMap[name];
                const cat = loc ? loc.categoria : 'Sistema';
                const procs = loc ? (loc.totalProcessos || 0) : 0;
                const size = Math.max(10, Math.min(40, 8 + Math.sqrt(procs) * 2));
                const atpCount = (atpsByLoc[name] || []).length;
                const prefCount = (prefsByLoc[name] || []).length;
                nodes.push({
                    id: name, label: showLabels ? name : '', title: name + '\n' + cat + '\n' + procs + ' processos\n' + atpCount + ' ATPs | ' + prefCount + ' prefs',
                    color: { background: catColor(cat), border: catColor(cat), highlight: { background: '#fff', border: catColor(cat) } },
                    size, font: { color: '#e2e8f0', size: 10, face: 'Inter' },
                    borderWidth: atpCount > 3 ? 3 : 1, shape: procs > 50 ? 'dot' : 'dot',
                    _cat: cat, _procs: procs, _atps: atpCount
                });
            }

            const filteredEdges = filterFn ? edges.filter(filterFn) : edges;
            filteredEdges.forEach(e => {
                addNode(e.from);
                addNode(e.to);
                edgesVis.push({
                    from: e.from, to: e.to,
                    arrows: 'to',
                    color: { color: catColor((locMap[e.from] || {}).categoria || 'Sistema'), opacity: 0.5, highlight: '#fff' },
                    width: 1.5, smooth: { type: 'curvedCW', roundness: 0.15 },
                    title: 'ATP #' + e.atp.n + ' (' + (e.atp.g || 'sem grupo') + ')\n' + e.atp.t
                });
            });

            // Add orphan nodes (locs not in any edge but matching filter)
            if (!filterFn) {
                nodeSet.forEach(n => addNode(n));
            }

            allNodes = new vis.DataSet(nodes);
            allEdges = new vis.DataSet(edgesVis);

            const container = document.getElementById('graph');
            const options = {
                nodes: { borderWidth: 1.5, shadow: { enabled: true, size: 6, color: 'rgba(0,0,0,0.3)' } },
                edges: { smooth: { type: 'curvedCW', roundness: 0.12 } },
                physics: {
                    enabled: physicsOn,
                    barnesHut: { gravitationalConstant: -4000, centralGravity: 0.3, springLength: 120, springConstant: 0.04, damping: 0.09 },
                    stabilization: { iterations: 200, fit: true }
                },
                interaction: { hover: true, tooltipDelay: 150, zoomView: true, dragView: true, navigationButtons: false },
                layout: { improvedLayout: false }
            };

            if (network) network.destroy();
            network = new vis.Network(container, { nodes: allNodes, edges: allEdges }, options);

            network.on('click', function (params) {
                if (params.nodes.length > 0) {
                    showNodeDetail(params.nodes[0]);
                }
            });

            network.on('stabilizationIterationsDone', function () {
                document.getElementById('loading').style.display = 'none';
            });

            setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 5000);
        }

        // ===== Detail Panel =====
        function showNodeDetail(name) {
            const loc = locMap[name];
            const cat = loc ? loc.categoria : 'Desconhecido';
            const procs = loc ? (loc.totalProcessos || 0) : 0;
            const atps = atpsByLoc[name] || [];
            const prefs = prefsByLoc[name] || [];

            // Find incoming/outgoing
            const incoming = edges.filter(e => e.to === name);
            const outgoing = edges.filter(e => e.from === name);

            document.getElementById('panel-empty').style.display = 'none';
            const pc = document.getElementById('panel-content');
            pc.style.display = 'block';

            let html = '<div class="panel-header">';
            html += '<div class="panel-badge" style="background:' + catColor(cat) + ';color:#fff">' + cat + '</div>';
            if (procs > 0) html += '<div class="panel-badge" style="background:var(--bg3)">' + procs + ' proc.</div>';
            html += '</div>';
            html += '<div class="panel-title">' + name + '</div>';

            // Tab bar
            html += '<div class="panel-tab-bar">';
            html += '<div class="panel-tab active" onclick="switchTab(this,\'tab-flow\')">Fluxo</div>';
            html += '<div class="panel-tab" onclick="switchTab(this,\'tab-atps\')">ATPs (' + atps.length + ')</div>';
            html += '<div class="panel-tab" onclick="switchTab(this,\'tab-prefs\')">Prefs (' + prefs.length + ')</div>';
            html += '</div>';

            // TAB: Flow
            html += '<div class="panel-tab-content active" id="tab-flow">';
            if (incoming.length > 0) {
                html += '<div class="panel-section"><div class="panel-label">⬅️ Recebe processos de (' + incoming.length + ')</div>';
                incoming.forEach(e => {
                    html += '<div class="panel-flow"><a onclick="focusNode(\'' + esc(e.from) + '\')">' + e.from + '</a> <span class="arrow">→</span> aqui</div>';
                });
                html += '</div>';
            }
            if (outgoing.length > 0) {
                html += '<div class="panel-section"><div class="panel-label">➡️ Encaminha para (' + outgoing.length + ')</div>';
                outgoing.forEach(e => {
                    html += '<div class="panel-flow">aqui <span class="arrow">→</span> <a onclick="focusNode(\'' + esc(e.to) + '\')">' + e.to + '</a></div>';
                });
                html += '</div>';
            }
            if (incoming.length === 0 && outgoing.length === 0) {
                html += '<div class="panel-value" style="color:var(--fg3)">Nenhuma conexão ATP encontrada.</div>';
            }
            html += '</div>';

            // TAB: ATPs
            html += '<div class="panel-tab-content" id="tab-atps">';
            if (atps.length === 0) {
                html += '<div class="panel-value" style="color:var(--fg3)">Nenhuma ATP referencia este localizador.</div>';
            } else {
                atps.forEach(a => {
                    html += '<div class="issue-item">';
                    html += '<strong>#' + a.n + '</strong> ' + (a.g || '') + '<br>';
                    html += '<span style="color:var(--fg3)">' + (a.t || '') + '</span><br>';
                    if (a.r) html += '<span class="issue-tag" style="background:#ef4444;color:#fff">Rem: ' + a.r + '</span>';
                    if (a.i) html += '<span class="issue-tag" style="background:#22c55e;color:#fff">Inc: ' + a.i + '</span>';
                    if (a.ac) html += '<br><span style="font-size:11px;color:var(--amber)">' + a.ac.join(', ') + '</span>';
                    html += '</div>';
                });
            }
            html += '</div>';

            // TAB: Prefs
            html += '<div class="panel-tab-content" id="tab-prefs">';
            if (prefs.length === 0) {
                html += '<div class="panel-value" style="color:var(--fg3)">Nenhuma preferência aponta para este localizador.</div>';
            } else {
                prefs.forEach(p => {
                    html += '<div class="issue-item">';
                    html += '<strong>' + p.nm + '</strong><br>';
                    html += '<span style="color:var(--fg3)">' + (p.ev || '') + '</span><br>';
                    html += '<span class="issue-tag" style="background:var(--accent);color:#fff">' + (p.pl || '') + ' ' + (p.pr || '') + 'd</span>';
                    html += '</div>';
                });
            }
            html += '</div>';

            pc.innerHTML = html;

            // Highlight node in graph
            if (network) {
                network.selectNodes([name]);
                network.focus(name, { scale: 1.2, animation: { duration: 400, easingFunction: 'easeInOutQuad' } });
            }
        }

        function esc(s) { return s.replace(/'/g, "\\'"); }
        function switchTab(el, id) {
            el.parentElement.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            el.parentElement.parentElement.querySelectorAll('.panel-tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        function focusNode(name) {
            showNodeDetail(name);
        }

        // ===== Filters =====
        function filterByCategory(cat) {
            document.querySelectorAll('#cat-list .sb-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
            buildGraph(e => {
                const fromLoc = locMap[e.from];
                const toLoc = locMap[e.to];
                return (fromLoc && fromLoc.categoria === cat) || (toLoc && toLoc.categoria === cat);
            });
        }
        function filterByGroup(group) {
            document.querySelectorAll('#group-list .sb-btn').forEach(b => b.classList.toggle('active', b.dataset.group === group));
            buildGraph(e => (e.atp.g || '(sem grupo)') === group);
        }

        // ===== Views =====
        function setView(view) {
            document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === view));
            if (view === 'flow') {
                document.getElementById('graph').style.display = 'block';
                document.getElementById('panel-empty').style.display = 'block';
                document.getElementById('panel-content').style.display = 'none';
                buildGraph(null);
            } else if (view === 'phases') {
                showPhases();
            } else if (view === 'dashboard') {
                showDashboard();
            } else if (view === 'issues') {
                showIssues();
            }
        }

        // ===== Dashboard =====
        function showDashboard() {
            document.getElementById('graph').style.display = 'none';
            document.getElementById('panel-empty').style.display = 'none';
            const pc = document.getElementById('panel-content');
            pc.style.display = 'block';

            const customLocs = DATA_LOCS.filter(l => !l.sistema);
            const sysLocs = DATA_LOCS.filter(l => l.sistema);
            const activeATPs = DATA_ATPS.filter(a => a.a);
            const locsInATPs = new Set();
            DATA_ATPS.forEach(a => { if (a.r) locsInATPs.add(norm(a.r)); if (a.i) locsInATPs.add(norm(a.i)); });
            const customInATPs = customLocs.filter(l => locsInATPs.has(norm(l.nome)));
            const orphanLocs = customLocs.filter(l => !locsInATPs.has(norm(l.nome)) && (l.totalProcessos || 0) > 0);

            // Category breakdown
            const catBreakdown = {};
            customLocs.forEach(l => {
                const c = l.categoria || 'Outro';
                if (!catBreakdown[c]) catBreakdown[c] = { count: 0, procs: 0 };
                catBreakdown[c].count++;
                catBreakdown[c].procs += l.totalProcessos || 0;
            });

            let html = '<div class="panel-title" style="margin-bottom:16px">📊 Dashboard do Cartório</div>';

            // KPIs
            html += '<div class="dash-grid">';
            html += '<div class="dash-card"><div class="num" style="color:var(--accent)">' + customLocs.length + '</div><div class="lbl">Localizadores Personalizados</div></div>';
            html += '<div class="dash-card"><div class="num" style="color:var(--green)">' + activeATPs.length + '</div><div class="lbl">ATPs Ativas</div></div>';
            html += '<div class="dash-card"><div class="num" style="color:var(--amber)">' + DATA_PREFS.length + '</div><div class="lbl">Preferências</div></div>';
            html += '<div class="dash-card"><div class="num" style="color:var(--teal)">' + totalProcs.toLocaleString('pt-BR') + '</div><div class="lbl">Processos Ativos</div></div>';
            html += '<div class="dash-card"><div class="num" style="color:var(--accent2)">' + customInATPs.length + '</div><div class="lbl">Locs com ATPs</div></div>';
            html += '<div class="dash-card"><div class="num" style="color:var(--red)">' + orphanLocs.length + '</div><div class="lbl">Locs Órfãos com Processos</div></div>';
            html += '</div>';

            // Category pie
            html += '<div class="panel-section"><div class="panel-label">Localizadores por Categoria</div>';
            Object.entries(catBreakdown).sort((a, b) => b[1].procs - a[1].procs).forEach(([cat, d]) => {
                const pct = customLocs.length ? Math.round(d.count / customLocs.length * 100) : 0;
                html += '<div style="display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px">';
                html += '<div class="dot" style="background:' + catColor(cat) + ';width:8px;height:8px;border-radius:50%;flex-shrink:0"></div>';
                html += '<span style="flex:1">' + cat + '</span>';
                html += '<span style="color:var(--fg3)">' + d.count + ' locs</span>';
                html += '<span style="color:var(--fg2);font-weight:600">' + d.procs.toLocaleString('pt-BR') + ' proc.</span>';
                html += '<div style="width:60px;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden"><div style="width:' + pct + '%;height:100%;background:' + catColor(cat) + '"></div></div>';
                html += '</div>';
            });
            html += '</div>';

            // Top localizadores by process count
            html += '<div class="panel-section"><div class="panel-label">🏆 Top 15 Localizadores (por processos)</div>';
            customLocs.sort((a, b) => (b.totalProcessos || 0) - (a.totalProcessos || 0)).slice(0, 15).forEach((l, i) => {
                html += '<div class="issue-item" onclick="setView(\'flow\');setTimeout(()=>showNodeDetail(\'' + esc(norm(l.nome)) + '\'),600)">';
                html += '<strong style="color:' + catColor(l.categoria) + '">#' + (i + 1) + '</strong> ' + l.nome;
                html += ' <span style="float:right;color:var(--fg2)">' + (l.totalProcessos || 0) + '</span>';
                html += '</div>';
            });
            html += '</div>';

            pc.innerHTML = html;
        }

        // ===== Phases =====
        function showPhases() {
            document.getElementById('panel-empty').style.display = 'none';
            const pc = document.getElementById('panel-content');
            pc.style.display = 'block';

            // Determine phase order from ATP groups
            const phases = [
                { name: 'Distribuição / Triagem', icon: '📥', groups: ['0 -', '1.', '2 -'], color: '#3b82f6' },
                { name: 'Emenda à Inicial', icon: '🔁', groups: ['3 -'], color: '#f59e0b' },
                { name: 'Automações Práticas', icon: '⚡', groups: ['4.'], color: '#22c55e' },
                { name: 'DJE / Citação', icon: '📬', groups: ['5 -'], color: '#8b5cf6' },
                { name: 'Cumprimento Automático', icon: '🤖', groups: ['7 -'], color: '#14b8a6' },
                { name: 'Audiências', icon: '📅', groups: ['8 -'], color: '#ec4899' },
                { name: 'Rotina de Verificação', icon: '🔍', groups: ['9 -', '9.'], color: '#64748b' },
                { name: 'Correções', icon: '🔧', groups: ['10 '], color: '#795548' },
                { name: 'Limpeza de Localizadores', icon: '🧹', groups: ['11 ', '11.'], color: '#607d8b' },
                { name: 'Minuta Automática', icon: '📝', groups: ['12 ', '16.'], color: '#ef4444' },
                { name: 'Gratuidade', icon: '🆓', groups: ['13 '], color: '#22c55e' },
                { name: 'Petição Antes Assinatura', icon: '⚠️', groups: ['14 '], color: '#f59e0b' },
                { name: 'Classificador de Petições', icon: '🏷️', groups: ['15.'], color: '#a855f7' },
                { name: 'Empilhador (Divisão)', icon: '📂', groups: ['17 '], color: '#546e7a' },
                { name: 'Cartas Precatórias', icon: '📮', groups: ['18 ', '19 '], color: '#1976d2' },
                { name: 'Publicação / Hórus', icon: '📰', groups: ['35 ', '35.'], color: '#00838f' },
                { name: 'Limpa Decurso', icon: '🧼', groups: ['31 ', '21 '], color: '#607d8b' },
                { name: 'Atos Automáticos', icon: '⚙️', groups: ['22.', '24 ', '27 '], color: '#14b8a6' },
                { name: 'Julg Antecipado / Provas', icon: '⚖️', groups: ['25 '], color: '#7c3aed' },
                { name: 'Cumprimento de Sentença', icon: '📋', groups: ['26 '], color: '#22c55e' },
                { name: 'Suspensão', icon: '⏸️', groups: ['28 '], color: '#607d8b' },
                { name: 'Baixados', icon: '🗃️', groups: ['29 '], color: '#546e7a' },
            ];

            let html = '<div class="panel-title" style="margin-bottom:16px">📊 Fases do Processo</div>';
            html += '<div style="font-size:12px;color:var(--fg3);margin-bottom:16px">Visão macro das fases baseada nos grupos de ATPs. Clique para filtrar o grafo.</div>';

            phases.forEach(ph => {
                const matchingATPs = DATA_ATPS.filter(a => ph.groups.some(g => (a.g || '').startsWith(g)));
                const locs = new Set();
                matchingATPs.forEach(a => { if (a.r) locs.add(a.r); if (a.i) locs.add(a.i); });
                html += '<div class="issue-item" style="border-left:3px solid ' + ph.color + ';cursor:pointer" onclick="filterByPhase(' + JSON.stringify(ph.groups) + ')">';
                html += '<strong>' + ph.icon + ' ' + ph.name + '</strong>';
                html += '<span style="float:right;color:var(--fg3)">' + matchingATPs.length + ' ATPs</span>';
                html += '<div style="font-size:11px;color:var(--fg3);margin-top:2px">' + locs.size + ' localizadores envolvidos</div>';
                html += '</div>';
            });

            pc.innerHTML = html;

            // Show full graph
            buildGraph(null);
        }

        function filterByPhase(groups) {
            buildGraph(e => groups.some(g => (e.atp.g || '').startsWith(g)));
        }

        // ===== Issues / Insights =====
        function showIssues() {
            document.getElementById('graph').style.display = 'none';
            document.getElementById('panel-empty').style.display = 'none';
            const pc = document.getElementById('panel-content');
            pc.style.display = 'block';

            const customLocs = DATA_LOCS.filter(l => !l.sistema);
            const locsInATPs = new Set();
            DATA_ATPS.forEach(a => { if (a.r) locsInATPs.add(norm(a.r)); if (a.i) locsInATPs.add(norm(a.i)); });
            const locsInPrefs = new Set();
            DATA_PREFS.forEach(p => { const k = findLocKey(p.nl || ''); if (k) locsInPrefs.add(k); });

            // Orphan analysis
            const orphansWithProcs = customLocs.filter(l => !locsInATPs.has(norm(l.nome)) && !locsInPrefs.has(norm(l.nome)) && (l.totalProcessos || 0) > 0);
            const orphansEmpty = customLocs.filter(l => !locsInATPs.has(norm(l.nome)) && !locsInPrefs.has(norm(l.nome)) && (l.totalProcessos || 0) === 0);

            // Dead-end analysis (locs that receive processes but don't forward)
            const receives = new Set();
            const sends = new Set();
            edges.forEach(e => { receives.add(e.to); sends.add(e.from); });
            const deadEnds = [...receives].filter(n => !sends.has(n) && (locMap[n] || {}).totalProcessos > 0);

            // Bottleneck analysis (locs with most processes and most incoming ATPs)
            const bottlenecks = customLocs
                .filter(l => (l.totalProcessos || 0) > 50)
                .sort((a, b) => (b.totalProcessos || 0) - (a.totalProcessos || 0))
                .slice(0, 10);

            // ATPs without memo
            const atpsNoMemo = DATA_ATPS.filter(a => !a.temMemo && a.a);

            // Pref→Loc mismatch (prefs pointing to locs not in our localizadores list)
            const prefOrphans = DATA_PREFS.filter(p => {
                return (p.nl || '') && !findLocKey(p.nl);
            });

            let html = '<div class="panel-title" style="margin-bottom:16px">⚠️ Análise & Insights</div>';

            // Section: Orphan Locs
            html += '<div class="panel-section"><div class="panel-label">🔍 Localizadores Órfãos COM Processos (' + orphansWithProcs.length + ')</div>';
            html += '<div style="font-size:11px;color:var(--fg3);margin-bottom:6px">Localizadores sem ATPs nem preferências, mas com processos ativos. Podem ser manuais ou estar faltando automação.</div>';
            orphansWithProcs.sort((a, b) => (b.totalProcessos || 0) - (a.totalProcessos || 0)).forEach(l => {
                html += '<div class="issue-item" onclick="setView(\'flow\');setTimeout(()=>showNodeDetail(\'' + esc(norm(l.nome)) + '\'),600)">';
                html += '<span class="issue-tag" style="background:' + catColor(l.categoria) + ';color:#fff">' + l.categoria + '</span>';
                html += l.nome + ' <span style="float:right;color:var(--fg2)">' + l.totalProcessos + '</span>';
                html += '</div>';
            });
            html += '</div>';

            // Section: Dead Ends
            html += '<div class="panel-section"><div class="panel-label">🛑 Dead Ends — Localizadores sem Saída (' + deadEnds.length + ')</div>';
            html += '<div style="font-size:11px;color:var(--fg3);margin-bottom:6px">Recebem processos via ATP mas não encaminham adiante. Normalmente são finais (Conferir/Análise, Gabinete, Baixar) — verifica se há esquecidos.</div>';
            deadEnds.sort((a, b) => ((locMap[b] || {}).totalProcessos || 0) - ((locMap[a] || {}).totalProcessos || 0)).slice(0, 20).forEach(name => {
                const l = locMap[name];
                html += '<div class="issue-item" onclick="setView(\'flow\');setTimeout(()=>showNodeDetail(\'' + esc(name) + '\'),600)">';
                html += '<span class="issue-tag" style="background:' + catColor((l || {}).categoria || '') + ';color:#fff">' + ((l || {}).categoria || '?') + '</span>';
                html += name + ' <span style="float:right;color:var(--fg2)">' + ((l || {}).totalProcessos || '?') + '</span>';
                html += '</div>';
            });
            html += '</div>';

            // Section: Bottlenecks
            html += '<div class="panel-section"><div class="panel-label">🔥 Gargalos — Localizadores com mais processos (' + bottlenecks.length + ')</div>';
            bottlenecks.forEach((l, i) => {
                const atpCnt = (atpsByLoc[norm(l.nome)] || []).length;
                html += '<div class="issue-item" onclick="setView(\'flow\');setTimeout(()=>showNodeDetail(\'' + esc(norm(l.nome)) + '\'),600)">';
                html += '<strong style="color:' + catColor(l.categoria) + '">#' + (i + 1) + '</strong> ';
                html += l.nome;
                html += ' <span style="float:right;color:var(--fg2)">' + l.totalProcessos + ' proc. | ' + atpCnt + ' ATPs</span>';
                html += '</div>';
            });
            html += '</div>';

            // Section: ATPs sem memo
            html += '<div class="panel-section"><div class="panel-label">📝 ATPs Ativas sem Memo (' + atpsNoMemo.length + '/' + DATA_ATPS.filter(a => a.a).length + ')</div>';
            html += '<div style="font-size:11px;color:var(--fg3);margin-bottom:6px">ATPs ativas sem memo — dificulta a manutenção futura.</div>';
            html += '<div class="dash-grid">';
            // Group by grupo
            const noMemoByGroup = {};
            atpsNoMemo.forEach(a => { const g = a.g || '(sem grupo)'; noMemoByGroup[g] = (noMemoByGroup[g] || 0) + 1; });
            Object.entries(noMemoByGroup).sort((a, b) => b[1] - a[1]).slice(0, 8).forEach(([g, c]) => {
                html += '<div class="dash-card"><div class="num" style="color:var(--red);font-size:18px">' + c + '</div><div class="lbl">' + g + '</div></div>';
            });
            html += '</div></div>';

            // Section: Orphan empty locs
            html += '<div class="panel-section"><div class="panel-label">🗑️ Localizadores Potencialmente Desusados (' + orphansEmpty.length + ')</div>';
            html += '<div style="font-size:11px;color:var(--fg3);margin-bottom:6px">Sem ATPs, sem preferências, sem processos. Candidatos à remoção.</div>';
            orphansEmpty.slice(0, 15).forEach(l => {
                html += '<div class="issue-item">';
                html += '<span class="issue-tag" style="background:' + catColor(l.categoria) + ';color:#fff">' + l.categoria + '</span>';
                html += l.nome;
                html += '</div>';
            });
            if (orphansEmpty.length > 15) html += '<div style="font-size:11px;color:var(--fg3)">... e mais ' + (orphansEmpty.length - 15) + '</div>';
            html += '</div>';

            pc.innerHTML = html;
        }

        // ===== Controls =====
        function togglePhysics(btn) {
            physicsOn = !physicsOn;
            btn.classList.toggle('active');
            if (network) network.setOptions({ physics: { enabled: physicsOn } });
        }
        function fitGraph() { if (network) network.fit({ animation: true }); }
        function toggleLabels(btn) {
            showLabels = !showLabels;
            btn.classList.toggle('active');
            if (allNodes) {
                allNodes.forEach(n => { allNodes.update({ id: n.id, label: showLabels ? n.id : '' }); });
            }
        }

        // ===== Search =====
        document.getElementById('search').addEventListener('input', function (e) {
            const q = e.target.value.toLowerCase().trim();
            if (!q || q.length < 2) { if (network) network.unselectAll(); return; }
            const matching = [];
            allNodes.forEach(n => { if (n.id.toLowerCase().includes(q)) matching.push(n.id); });
            if (matching.length > 0 && network) {
                network.selectNodes(matching.slice(0, 10));
                if (matching.length === 1) {
                    network.focus(matching[0], { scale: 1.5, animation: true });
                    showNodeDetail(matching[0]);
                }
            }
        });

        // ===== Init =====
        try {
            if (typeof vis === 'undefined') throw new Error('vis-network não carregou — o CDN pode estar bloqueado pelo navegador');
            buildGraph(null);
        } catch (err) {
            console.error('Erro na inicialização:', err);
            var ld = document.getElementById('loading');
            ld.style.display = 'flex';
            ld.innerHTML = '<div style="text-align:center;padding:40px"><div style="font-size:48px;margin-bottom:16px">⚠️</div><div style="color:#ef4444;font-size:18px;font-weight:600">Erro ao inicializar</div><div style="color:#94a3b8;margin-top:8px;max-width:400px">' + err.message + '</div><div style="color:#64748b;font-size:12px;margin-top:16px">Tente desativar o bloqueio de rastreadores (Tracking Prevention) ou use outro navegador.</div></div>';
        }
    </script>
</body>

</html>
